spring.application.name=jobportal

#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:jobportaldb}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Mugya2001#}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.eazybytes.jobportal=${LOG_LEVEL:INFO}

logging.group.jobportal_error=com.eazybytes.jobportal.security,com.eazybytes.jobportal.contact
logging.level.jobportal_error=${LOG_LEVEL_ERROR:ERROR}

